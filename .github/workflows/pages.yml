name: Build and deploy Shrinknome

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2 and web export templates
        shell: bash
        run: |
          set -euo pipefail
          release="https://github.com/godotengine/godot/releases/download/4.7.2-stable"
          curl -L --fail --retry 3 "$release/Godot_v4.7.2-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          curl -L --fail --retry 3 "$release/Godot_v4.7.2-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot-bin"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          godot_bin="$RUNNER_TEMP/godot-bin/Godot_v4.7.2-stable_linux.x86_64"
          chmod +x "$godot_bin"
          ln -s "$godot_bin" "$RUNNER_TEMP/godot-bin/godot"
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/godot-template-unpack"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/godot-template-unpack"
          template_dir="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$template_dir"
          cp "$RUNNER_TEMP/godot-template-unpack/templates/"* "$template_dir/"

      - name: Import project and export Web build
        run: |
          mkdir -p public
          touch public/.nojekyll
          godot --headless --editor --path . --quit
          godot --headless --path . --export-release Web public/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload web build
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
